name: Build and deploy Next.js to Azure Web App - Ssim-Next

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
        name: Setup pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
        name: Setup Node.js

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm run build
        name: Build Next.js

      - run: |
          rm -f deploy.zip
          zip -r deploy.zip .next public package.json pnpm-lock.yaml next.config.* -q
        name: Create deploy.zip without node_modules

      - run: sleep 15
        name: Wait before deploy

      - uses: azure/webapps-deploy@v3
        with:
          app-name: "Ssim-Next"
          slot-name: "Production"
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2F380228651460DAA19A08B90CFD7D6 }}
        name: Deploy to Azure Web App
