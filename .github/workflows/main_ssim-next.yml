name: Build and deploy Next.js to Azure Web App - Ssim-Next

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install dependencies (CI)
        run: pnpm install --frozen-lockfile

      - name: Build (optional; Oryx can rebuild)
        run: pnpm run build

      - name: Create deploy.zip with source
        run: |
          rm -f deploy.zip
          # Include your source dir: replace "app" with "pages" if applicable
          zip -r deploy.zip app public package.json pnpm-lock.yaml next.config.* -q

      - name: Delay to avoid SCM restart conflict
        run: sleep 30

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Ssim-Next"
          slot-name: "Production"
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2F380228651460DAA19A08B90CFD7D6 }}
