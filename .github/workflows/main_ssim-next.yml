name: Build and deploy Next.js to Azure Web App - Ssim-Next

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies (CI)
        run: pnpm install --frozen-lockfile

      - name: Build (optional; Oryx can rebuild)
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://ssim.ac.in
          NEXT_PUBLIC_SITE_URL: https://ssim.ac.in

      - name: Create standalone deploy.zip
  run: |
    rm -f deploy.zip
    cp -r public .next/standalone/public
    mkdir -p .next/standalone/.next
    cp -r .next/static .next/standalone/.next/static
    mkdir -p .next/standalone/.next/cache
    mkdir -p .next/standalone/logs

    # Install sharp in isolation to avoid peer-dep conflicts with the app's own package.json
    mkdir -p /tmp/sharp-install
    cd /tmp/sharp-install
    npm init -y --silent
    npm install sharp@0.34.4 --no-save --omit=dev --platform=linux --arch=x64 --libc=glibc
    cd $GITHUB_WORKSPACE

    cp -r /tmp/sharp-install/node_modules/sharp .next/standalone/node_modules/
    cp -r /tmp/sharp-install/node_modules/@img .next/standalone/node_modules/

    zip -r deploy.zip .next/standalone public package.json -q

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Ssim-Next"
          slot-name: "Production"
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2F380228651460DAA19A08B90CFD7D6 }}